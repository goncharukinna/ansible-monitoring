---
- name: Deploy Prometheus and Grafana stack in Kubernetes
  hosts: local
  tasks:
    - name: Ensure Helm repo for Prometheus Community is added
      ansible.builtin.command:
        cmd: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      register: helm_repo_add
      changed_when: "'has been added' in helm_repo_add.stdout"

    - name: Update Helm repositories
      ansible.builtin.command:
        cmd: helm repo update
      changed_when: false

    - name: Create monitoring namespace
      kubernetes.core.k8s:
        name: monitoring
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: ~/.kube/config

    - name: Install or upgrade kube-prometheus-stack using Helm
      ansible.builtin.command:
        cmd: >
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack
          --namespace monitoring
          --create-namespace
          --set grafana.adminPassword=YourSecurePassword
          --wait
      register: helm_install_result
      changed_when: "'STATUS: deployed' in helm_install_result.stdout"

    - name: Wait for Grafana pod to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: monitoring
        label_selectors:
          - "app.kubernetes.io/name=grafana"
        kubeconfig: ~/.kube/config
      register: grafana_pod_info
      until: grafana_pod_info.resources[0].status.phase == "Running"
      retries: 30
      delay: 10